# Production compose for the 1GB OCI VM. Pulls prebuilt images from
# GHCR rather than building on-box (see .github/workflows/build.yml),
# and does NOT run Postgres locally — DATABASE_URL should point at an
# external managed instance (Supabase/Neon/OCI Autonomous DB free tier).
services:
  backend:
    image: ghcr.io/ssaiyajin/careerops-backend:latest
    container_name: careerops-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-exports:/app/exports
    restart: unless-stopped
    mem_limit: 550m

  frontend:
    image: ghcr.io/ssaiyajin/careerops-frontend:latest
    container_name: careerops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 300m

volumes:
  backend-uploads:
  backend-exports:
