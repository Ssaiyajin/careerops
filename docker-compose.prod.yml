# Optional future self-hosted deployment; not used by current production
# (Render + Vercel). Images must be published separately; this repository's
# GitHub Actions workflow only runs checks. Postgres is external, so
# DATABASE_URL must point at a managed instance.
services:
  backend:
    image: ghcr.io/ssaiyajin/careerops-backend:latest
    container_name: careerops-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-exports:/app/exports
    restart: unless-stopped
    environment:
      APP_ENV: main
    mem_limit: 300m
    memswap_limit: 300m

  frontend:
    image: ghcr.io/ssaiyajin/careerops-frontend:latest
    container_name: careerops-frontend
    environment:
      BACKEND_API_URL: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m

volumes:
  backend-uploads:
  backend-exports:

networks:
  default:
    name: careerops_default
