# Production deployment on the GCP VM. CI publishes these images to GHCR;
# the VM only pulls immutable commit tags and never builds application images.
services:
  backend:
    image: ghcr.io/ssaiyajin/careerops-backend:${IMAGE_TAG:?Set IMAGE_TAG to the release commit SHA}
    container_name: careerops-backend
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: main
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the VM .env file}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the VM .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the VM .env file}
    volumes:
      - backend-uploads:/app/uploads
      - backend-exports:/app/exports
    restart: unless-stopped
    mem_limit: 300m
    memswap_limit: 300m

  frontend:
    image: ghcr.io/ssaiyajin/careerops-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the release commit SHA}
    container_name: careerops-frontend
    environment:
      BACKEND_API_URL: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m

volumes:
  backend-uploads:
  backend-exports:

networks:
  default:
    name: careerops_default
