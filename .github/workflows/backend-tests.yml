name: CareerOps Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - dev

jobs:
  backend-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-only-secret-not-used-in-prod"
          GEMINI_API_KEY: "test-key"
        run: |
          pytest -v
