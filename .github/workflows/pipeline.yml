name: CareerOps Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected branch, or import the existing GCP VM once
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - import-existing-vm

permissions:
  contents: read

concurrency:
  group: careerops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend Tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run backend tests (500 MB limit)
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-only-secret-not-used-in-prod"
          GEMINI_API_KEY: "test-key"
        run: |
          docker run --rm \
            --memory=500m \
            --memory-swap=500m \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/backend \
            --env DATABASE_URL \
            --env JWT_SECRET_KEY \
            --env GEMINI_API_KEY \
            --env APP_ENV=dev \
            python:3.12-slim \
            sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential libpq-dev
              rm -rf /var/lib/apt/lists/*
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              alembic upgrade head
              pytest -v -p no:cacheprovider
            '

  frontend-tests:
    name: Frontend Tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run frontend checks (500 MB limit)
        run: |
          docker run --rm \
            --memory=500m \
            --memory-swap=500m \
            --volume "$GITHUB_WORKSPACE/frontend:/workspace" \
            --workdir /workspace \
            --env NODE_OPTIONS=--max-old-space-size=256 \
            node:20-slim \
            sh -ec '
              npm ci
              npm run lint
              npm run typecheck
              npm test -- --runInBand
            '

  deploy-render-dev:
    name: Wait for Render dev deployment
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger or wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID || secrets.RENDER_DEV_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY Actions secret}"
          : "${RENDER_SERVICE_ID:?Set RENDER_DEV_SERVICE_ID as an Actions variable or secret}"

          deploys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=100")"
          existing="$(jq -c --arg sha "$COMMIT_SHA" \
            '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
            <<< "$deploys")"
          existing_status="$(jq -r '.status // empty' <<< "$existing")"

          case "$existing_status" in
            live|created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
              echo "Found an existing Render deployment for $COMMIT_SHA ($existing_status); will wait for it."
              ;;
            build_failed|update_failed|pre_deploy_failed|canceled|"")
              echo "Triggering Render deployment for $COMMIT_SHA."
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "$(jq -nc --arg sha "$COMMIT_SHA" '{commitId: $sha}')" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
                --output /dev/null
              ;;
            *)
              echo "Unexpected existing Render deployment status: $existing_status" >&2
              exit 1
              ;;
          esac

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deploys="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=100")"
            deploy="$(jq -c --arg sha "$COMMIT_SHA" \
              '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
              <<< "$deploys")"

            if [[ -n "$deploy" ]]; then
              status="$(jq -r '.status' <<< "$deploy")"
              case "$status" in
                live)
                  echo "Render deployment for $COMMIT_SHA is live."
                  exit 0
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled)
                  echo "Render deployment for $COMMIT_SHA failed with status: $status" >&2
                  exit 1
                  ;;
                created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                  echo "Render deployment is $status; checking again in 15 seconds."
                  ;;
                *)
                  echo "Unexpected Render deployment status for $COMMIT_SHA: $status" >&2
                  exit 1
                  ;;
              esac
            else
              echo "No Render deployment found yet for $COMMIT_SHA; checking again in 15 seconds."
            fi
            sleep 15
          done

          echo "Timed out after 20 minutes waiting for Render deployment of $COMMIT_SHA." >&2
          exit 1

  deploy-vercel-dev:
    name: Wait for Vercel dev deployment
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: deploy-render-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger or wait for Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID as an Actions variable or secret}"

          query=(
            --data-urlencode "projectId=$VERCEL_PROJECT_ID"
            --data-urlencode "target=preview"
            --data-urlencode "branch=dev"
            --data-urlencode "sha=$COMMIT_SHA"
            --data-urlencode "limit=20"
          )
          if [[ -n "${VERCEL_TEAM_ID:-}" ]]; then
            query+=(--data-urlencode "teamId=$VERCEL_TEAM_ID")
          fi

          deployments="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Accept: application/json" \
            "${query[@]}" \
            https://api.vercel.com/v7/deployments)"
          existing_state="$(jq -r '.deployments[0].state // empty' <<< "$deployments")"

          case "$existing_state" in
            READY|BUILDING|INITIALIZING|QUEUED)
              echo "Found an existing Vercel deployment for $COMMIT_SHA ($existing_state); will wait for it."
              ;;
            ERROR|CANCELED|BLOCKED|"")
              echo "Triggering Vercel preview deployment for $COMMIT_SHA."
              body="$(jq -nc \
                --arg name careerops \
                --arg project "$VERCEL_PROJECT_ID" \
                --arg org Ssaiyajin \
                --arg repo careerops \
                --arg ref dev \
                --arg sha "$COMMIT_SHA" \
                '{name: $name, project: $project, gitSource: {type: "github", org: $org, repo: $repo, ref: $ref, sha: $sha}}')"
              create_url="https://api.vercel.com/v13/deployments?skipAutoDetectionConfirmation=1"
              if [[ -n "${VERCEL_TEAM_ID:-}" ]]; then
                create_url+="&teamId=$VERCEL_TEAM_ID"
              fi
              http_status="$(curl --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "$body" \
                "$create_url" \
                --output "$RUNNER_TEMP/vercel-create-response.json" \
                --write-out '%{http_code}')"
              if [[ ! "$http_status" =~ ^2 ]]; then
                echo "Vercel deployment request failed with HTTP $http_status:" >&2
                jq -r '.error.message // .message // .' "$RUNNER_TEMP/vercel-create-response.json" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unexpected existing Vercel deployment state: $existing_state" >&2
              exit 1
              ;;
          esac

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deployments="$(curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Accept: application/json" \
              "${query[@]}" \
              https://api.vercel.com/v7/deployments)"
            state="$(jq -r '.deployments[0].state // empty' <<< "$deployments")"

            case "$state" in
              READY)
                url="$(jq -r '.deployments[0].url // empty' <<< "$deployments")"
                echo "Vercel preview for $COMMIT_SHA is ready: ${url:-URL not provided}"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                message="$(jq -r '.deployments[0].errorMessage // .deployments[0].errorCode // .deployments[0].state' <<< "$deployments")"
                echo "Vercel deployment for $COMMIT_SHA ended with $state: $message" >&2
                exit 1
                ;;
              BUILDING|INITIALIZING|QUEUED)
                echo "Vercel deployment is $state; checking again in 15 seconds."
                ;;
              "")
                echo "No Vercel preview found yet for $COMMIT_SHA; checking again in 15 seconds."
                ;;
              *)
                echo "Unexpected Vercel deployment state for $COMMIT_SHA: $state" >&2
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Timed out after 20 minutes waiting for Vercel deployment of $COMMIT_SHA." >&2
          exit 1

  gcp-import-existing-vm:
    name: Import existing GCP VM (one-time)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'import-existing-vm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_enable_aws: "false"
      TF_VAR_enable_azure: "false"
      TF_VAR_enable_gcp: "true"
      TF_VAR_gcp_project: careerops-503307
      TF_VAR_gcp_region: us-central1
      TF_VAR_gcp_zone: us-central1-a
      TF_VAR_gcp_instance_name: careerops
      TF_VAR_gcp_machine_type: e2-micro
      TF_VAR_gcp_disk_size_gb: "30"
      TF_VAR_gcp_disk_type: pd-standard
      TF_VAR_gcp_ssh_username: deploy
      TF_VAR_gcp_network_tags: '["http-server","https-server","lb-health-check"]'
      TF_VAR_gcp_manage_firewall: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Import the existing VM into remote state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          TF_VAR_gcp_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key

          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "The VM is already in Terraform state; refusing a duplicate import." >&2
            exit 1
          fi
          terraform -chdir=infrastructure import -input=false \
            "$address" \
            "projects/careerops-503307/zones/us-central1-a/instances/careerops"

  terraform-plan:
    name: Terraform init and plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_enable_aws: "false"
      TF_VAR_enable_azure: "false"
      TF_VAR_enable_gcp: "true"
      TF_VAR_gcp_project: careerops-503307
      TF_VAR_gcp_region: us-central1
      TF_VAR_gcp_zone: us-central1-a
      TF_VAR_gcp_instance_name: careerops
      TF_VAR_gcp_machine_type: e2-micro
      TF_VAR_gcp_disk_size_gb: "30"
      TF_VAR_gcp_disk_type: pd-standard
      TF_VAR_gcp_ssh_username: deploy
      TF_VAR_gcp_network_tags: '["http-server","https-server","lb-health-check"]'
      TF_VAR_gcp_manage_firewall: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Initialize remote state and require the imported VM
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          TF_VAR_gcp_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key
          echo "TF_VAR_gcp_ssh_public_key=$TF_VAR_gcp_ssh_public_key" >> "$GITHUB_ENV"

          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "Refusing to plan or apply: import the existing VM first." >&2
            exit 1
          fi

      - name: Create saved plan and reject destructive changes
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure plan -input=false -out=tfplan
          terraform -chdir=infrastructure show -json tfplan > infrastructure/plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("infrastructure/plan.json").read_text())
          deletes = [
              change["address"]
              for change in plan["resource_changes"]
              if "delete" in change["change"]["actions"]
          ]
          if deletes:
              raise SystemExit(
                  "Refusing plan with resource deletion/replacement: "
                  + ", ".join(deletes)
              )
          PY

          terraform -chdir=infrastructure show -no-color tfplan \
            > "$RUNNER_TEMP/terraform-plan.txt"
          {
            echo '### GCP Terraform plan'
            echo 'The apply job requires approval in the `gcp-terraform-apply` environment.'
            echo '```'
            cat "$RUNNER_TEMP/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infrastructure/tfplan
          retention-days: 30

  terraform-apply:
    name: Terraform apply (approval required)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: gcp-terraform-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/download-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infrastructure

      - name: Apply the reviewed plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "Refusing to apply: the VM is not imported into Terraform state." >&2
            exit 1
          fi
          terraform -chdir=infrastructure apply -input=false -auto-approve tfplan

  publish-gcp-images:
    name: Publish GCP container images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/ssaiyajin/careerops-backend:latest
            ghcr.io/ssaiyajin/careerops-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/ssaiyajin/careerops-frontend:latest
            ghcr.io/ssaiyajin/careerops-frontend:${{ github.sha }}

  deploy-gcp:
    name: Deploy to GCP VM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: publish-gcp-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Deploy over SSH
        env:
          VM_EXTERNAL_IP: ${{ secrets.VM_EXTERNAL_IP || vars.VM_EXTERNAL_IP }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOST: ${{ secrets.VM_KNOWN_HOST || vars.VM_KNOWN_HOST }}
          VM_SSH_USER: deploy
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          : "${VM_EXTERNAL_IP:?Set the VM_EXTERNAL_IP repository secret or variable}"
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"
          : "${VM_KNOWN_HOST:?Set the VM_KNOWN_HOST repository secret or variable}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/careerops-deploy"
          chmod 600 "$HOME/.ssh/careerops-deploy"
          printf '%s\n' "$VM_KNOWN_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh_options=(-i "$HOME/.ssh/careerops-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$VM_SSH_USER@$VM_EXTERNAL_IP" \
            "sudo docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh "${ssh_options[@]}" "$VM_SSH_USER@$VM_EXTERNAL_IP" 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP_DIR="$HOME/careerops"
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch main --single-branch https://github.com/Ssaiyajin/careerops.git "$APP_DIR"
          else
            git -C "$APP_DIR" pull --ff-only origin main
          fi
          cd "$APP_DIR"

          if ! sudo grep -Eq '^DATABASE_URL=.+$' backend/.env ||
             ! sudo grep -Eq '^JWT_SECRET_KEY=.+$' backend/.env ||
             sudo grep -Eq '^(DATABASE_URL|JWT_SECRET_KEY)=REPLACE_ME$' backend/.env; then
            echo "Configure DATABASE_URL and JWT_SECRET_KEY in backend/.env before deployment." >&2
            exit 1
          fi

          if [ ! -f monitoring/.env ]; then
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" | sudo tee monitoring/.env >/dev/null
            sudo chmod 600 monitoring/.env
          fi

          sudo docker compose -f docker-compose.prod.yml pull
          sudo docker compose -f docker-compose.prod.yml up -d
          sudo docker compose --project-name careerops-monitoring \
            --env-file monitoring/.env -f monitoring/docker-compose.yml pull
          sudo docker compose --project-name careerops-monitoring \
            --env-file monitoring/.env -f monitoring/docker-compose.yml up -d
          REMOTE
