name: CareerOps CI

# CI runs tests and quality checks only. Render and Vercel deployments are
# managed separately; cloud infrastructure deployment is intentionally disabled.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run backend tests (500 MB limit)
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-only-secret-not-used-in-prod"
          GEMINI_API_KEY: "test-key"
        run: |
          docker run --rm \
            --memory=500m \
            --memory-swap=500m \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/backend \
            --env DATABASE_URL \
            --env JWT_SECRET_KEY \
            --env GEMINI_API_KEY \
            --env APP_ENV=dev \
            python:3.12-slim \
            sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential libpq-dev
              rm -rf /var/lib/apt/lists/*
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              alembic upgrade head
              pytest -v -p no:cacheprovider
            '

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run frontend checks (500 MB limit)
        run: |
          docker run --rm \
            --memory=500m \
            --memory-swap=500m \
            --volume "$GITHUB_WORKSPACE/frontend:/workspace" \
            --workdir /workspace \
            --env NODE_OPTIONS=--max-old-space-size=256 \
            node:20-slim \
            sh -ec '
              npm ci
              npm run lint
              npm run typecheck
              npm test -- --runInBand
            '
