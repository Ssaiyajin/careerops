name: CareerOps Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected branch or run a separate GCP Terraform operation
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - import-existing-vm
          - terraform-apply

permissions:
  contents: read

concurrency:
  group: careerops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend Tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run backend tests (500 MB limit)
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-only-secret-not-used-in-prod"
          GEMINI_API_KEY: "test-key"
        run: |
          docker run --rm \
            --memory=500m \
            --memory-swap=500m \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/backend \
            --env DATABASE_URL \
            --env JWT_SECRET_KEY \
            --env GEMINI_API_KEY \
            --env APP_ENV=dev \
            python:3.12-slim \
            sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential libpq-dev
              rm -rf /var/lib/apt/lists/*
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              alembic upgrade head
              pytest -v -p no:cacheprovider
            '

  frontend-tests:
    name: Frontend Tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run frontend checks (2 GB limit)
        run: |
          docker run --rm \
            --memory=2g \
            --memory-swap=2g \
            --volume "$GITHUB_WORKSPACE/frontend:/workspace" \
            --workdir /workspace \
            --env NODE_OPTIONS=--max-old-space-size=1536 \
            node:20-slim \
            sh -ec '
              npm ci
              npm run lint
              npm run typecheck
              npm test -- --runInBand
            '

  dependency-audit:
    name: Dependency audit
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          requirements="$RUNNER_TEMP/backend-requirements-audit.txt"
          grep -vE '^[[:space:]]*en_core_web_sm[[:space:]]*@' \
            backend/requirements.txt > "$requirements"
          echo "Skipping en_core_web_sm: the spaCy model wheel is hosted on GitHub and is not indexed by PyPI."
          pip-audit -r "$requirements"

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            aquasec/trivy:0.76.1 \
            fs --scanners vuln,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /work

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2.3.9

  terraform-security:
    name: Terraform security scan
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/modules/gcp
          framework: terraform
          soft_fail: false

  k8s-manifests-lint:
    name: Lint Kubernetes manifests
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest schemas and Kustomize build
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/k8s:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary \
            /work/namespace.yaml /work/config.yaml /work/backend.yaml /work/frontend.yaml /work/secret.example.yaml
          kubectl kustomize k8s > "$RUNNER_TEMP/careerops-k8s.yaml"

  k8s-kind-smoke:
    name: Deploy to kind and smoke/load test
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: [backend-tests, frontend-tests, k8s-manifests-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: careerops

      - name: Build and load application images
        run: |
          set -euo pipefail
          docker build --tag ghcr.io/ssaiyajin/careerops-backend:latest ./backend
          docker build --tag ghcr.io/ssaiyajin/careerops-frontend:latest ./frontend
          kind load docker-image \
            ghcr.io/ssaiyajin/careerops-backend:latest \
            ghcr.io/ssaiyajin/careerops-frontend:latest \
            --name careerops

      - name: Deploy manifests and create test configuration
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl -n careerops create secret generic careerops-backend \
            --from-literal=DATABASE_URL=sqlite:////tmp/careerops.db \
            --from-literal=JWT_SECRET_KEY=kind-smoke-test-secret \
            --from-literal=GEMINI_API_KEY=kind-smoke-test-key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/

      - name: Wait for workloads, smoke-test both services, and load-test backend
        run: |
          set -euo pipefail
          kubectl -n careerops rollout status deployment/careerops-backend --timeout=300s
          kubectl -n careerops rollout status deployment/careerops-frontend --timeout=300s

          kubectl -n careerops port-forward service/careerops-backend 18000:8000 \
            > "$RUNNER_TEMP/backend-port-forward.log" 2>&1 &
          backend_forward_pid=$!
          kubectl -n careerops port-forward service/careerops-frontend 13000:3000 \
            > "$RUNNER_TEMP/frontend-port-forward.log" 2>&1 &
          frontend_forward_pid=$!
          trap 'kill "$backend_forward_pid" "$frontend_forward_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:18000/health
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:13000/ > /dev/null
          kubectl -n careerops run careerops-backend-smoke \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --command -- \
            curl --fail --silent --show-error \
            http://careerops-backend:8000/health
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/tests/load:/scripts:ro" \
            --env BASE_URL=http://127.0.0.1:18000 \
            grafana/k6:0.56.0 run /scripts/health.js

  deploy-render:
    name: Deploy backend to Render
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: [backend-tests, frontend-tests, dependency-audit, secret-scan, k8s-kind-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Trigger or wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ github.ref == 'refs/heads/main' && (vars.RENDER_PROD_SERVICE_ID || secrets.RENDER_PROD_SERVICE_ID) || (github.ref == 'refs/heads/dev' && (vars.RENDER_DEV_SERVICE_ID || secrets.RENDER_DEV_SERVICE_ID)) }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY Actions secret}"
          : "${RENDER_SERVICE_ID:?Set RENDER_PROD_SERVICE_ID and RENDER_DEV_SERVICE_ID as Actions variables or secrets}"

          deploys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=100")"
          existing="$(jq -c --arg sha "$COMMIT_SHA" \
            '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
            <<< "$deploys")"
          existing_status="$(jq -r '.status // empty' <<< "$existing")"

          case "$existing_status" in
            live|created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
              echo "Found an existing Render deployment for $COMMIT_SHA ($existing_status); will wait for it."
              ;;
            build_failed|update_failed|pre_deploy_failed|canceled|"")
              echo "Triggering Render deployment for $COMMIT_SHA."
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "$(jq -nc --arg sha "$COMMIT_SHA" '{commitId: $sha}')" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
                --output /dev/null
              ;;
            *)
              echo "Unexpected existing Render deployment status: $existing_status" >&2
              exit 1
              ;;
          esac

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deploys="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=100")"
            deploy="$(jq -c --arg sha "$COMMIT_SHA" \
              '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
              <<< "$deploys")"

            if [[ -n "$deploy" ]]; then
              status="$(jq -r '.status' <<< "$deploy")"
              case "$status" in
                live)
                  echo "Render deployment for $COMMIT_SHA is live."
                  exit 0
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled)
                  echo "Render deployment for $COMMIT_SHA failed with status: $status" >&2
                  exit 1
                  ;;
                created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                  echo "Render deployment is $status; checking again in 15 seconds."
                  ;;
                *)
                  echo "Unexpected Render deployment status for $COMMIT_SHA: $status" >&2
                  exit 1
                  ;;
              esac
            else
              echo "No Render deployment found yet for $COMMIT_SHA; checking again in 15 seconds."
            fi
            sleep 15
          done

          echo "Timed out after 20 minutes waiting for Render deployment of $COMMIT_SHA." >&2
          exit 1

  deploy-vercel:
    name: Deploy frontend to Vercel
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    needs: deploy-render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger or wait for Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
          VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          DEPLOY_BRANCH: ${{ github.ref == 'refs/heads/main' && 'main' || 'dev' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID as an Actions variable or secret}"

          query=(
            --data-urlencode "projectId=$VERCEL_PROJECT_ID"
            --data-urlencode "target=$VERCEL_TARGET"
            --data-urlencode "branch=$DEPLOY_BRANCH"
            --data-urlencode "sha=$COMMIT_SHA"
            --data-urlencode "limit=20"
          )
          if [[ -n "${VERCEL_TEAM_ID:-}" ]]; then
            query+=(--data-urlencode "teamId=$VERCEL_TEAM_ID")
          fi

          deployments="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Accept: application/json" \
            "${query[@]}" \
            https://api.vercel.com/v7/deployments)"
          existing_state="$(jq -r '.deployments[0].state // empty' <<< "$deployments")"

          case "$existing_state" in
            READY|BUILDING|INITIALIZING|QUEUED)
              echo "Found an existing Vercel deployment for $COMMIT_SHA ($existing_state); will wait for it."
              ;;
            ERROR|CANCELED|BLOCKED|"")
              echo "Triggering Vercel $VERCEL_TARGET deployment for $COMMIT_SHA."
              body="$(jq -nc \
                --arg name careerops \
                --arg project "$VERCEL_PROJECT_ID" \
                --arg org Ssaiyajin \
                --arg repo careerops \
                --arg ref "$DEPLOY_BRANCH" \
                --arg target "$VERCEL_TARGET" \
                --arg sha "$COMMIT_SHA" \
                '{name: $name, project: $project, gitSource: {type: "github", org: $org, repo: $repo, ref: $ref, sha: $sha}} |
                if $target == "production" then . + {target: $target} else . end')"
              create_url="https://api.vercel.com/v13/deployments?skipAutoDetectionConfirmation=1"
              if [[ -n "${VERCEL_TEAM_ID:-}" ]]; then
                create_url+="&teamId=$VERCEL_TEAM_ID"
              fi
              http_status="$(curl --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "$body" \
                "$create_url" \
                --output "$RUNNER_TEMP/vercel-create-response.json" \
                --write-out '%{http_code}')"
              if [[ ! "$http_status" =~ ^2 ]]; then
                echo "Vercel deployment request failed with HTTP $http_status:" >&2
                jq -r '.error.message // .message // .' "$RUNNER_TEMP/vercel-create-response.json" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unexpected existing Vercel deployment state: $existing_state" >&2
              exit 1
              ;;
          esac

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deployments="$(curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Accept: application/json" \
              "${query[@]}" \
              https://api.vercel.com/v7/deployments)"
            state="$(jq -r '.deployments[0].state // empty' <<< "$deployments")"

            case "$state" in
              READY)
                url="$(jq -r '.deployments[0].url // empty' <<< "$deployments")"
                echo "Vercel $VERCEL_TARGET deployment for $COMMIT_SHA is ready: ${url:-URL not provided}"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                message="$(jq -r '.deployments[0].errorMessage // .deployments[0].errorCode // .deployments[0].state' <<< "$deployments")"
                echo "Vercel deployment for $COMMIT_SHA ended with $state: $message" >&2
                exit 1
                ;;
              BUILDING|INITIALIZING|QUEUED)
                echo "Vercel deployment is $state; checking again in 15 seconds."
                ;;
              "")
                echo "No Vercel $VERCEL_TARGET deployment found yet for $COMMIT_SHA; checking again in 15 seconds."
                ;;
              *)
                echo "Unexpected Vercel deployment state for $COMMIT_SHA: $state" >&2
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Timed out after 20 minutes waiting for Vercel deployment of $COMMIT_SHA." >&2
          exit 1

  gcp-import-existing-vm:
    name: Import existing GCP VM (one-time)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'import-existing-vm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_enable_aws: "false"
      TF_VAR_enable_azure: "false"
      TF_VAR_enable_gcp: "true"
      TF_VAR_gcp_project: careerops-503307
      TF_VAR_gcp_region: us-central1
      TF_VAR_gcp_zone: us-central1-a
      TF_VAR_gcp_instance_name: careerops
      TF_VAR_gcp_machine_type: e2-micro
      TF_VAR_gcp_disk_size_gb: "30"
      TF_VAR_gcp_disk_type: pd-standard
      TF_VAR_gcp_ssh_username: deploy
      TF_VAR_gcp_network_tags: '["http-server","https-server","lb-health-check"]'
      TF_VAR_gcp_manage_firewall: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Import the existing VM into remote state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          TF_VAR_gcp_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key

          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if terraform -chdir=infra/terraform state list | grep -Fxq "$address"; then
            echo "The VM is already in Terraform state; refusing a duplicate import." >&2
            exit 1
          fi
          terraform -chdir=infra/terraform import -input=false \
            "$address" \
            "projects/careerops-503307/zones/us-central1-a/instances/careerops"

  terraform-plan:
    name: Terraform init and plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'terraform-apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_enable_aws: "false"
      TF_VAR_enable_azure: "false"
      TF_VAR_enable_gcp: "true"
      TF_VAR_gcp_project: careerops-503307
      TF_VAR_gcp_region: us-central1
      TF_VAR_gcp_zone: us-central1-a
      TF_VAR_gcp_instance_name: careerops
      TF_VAR_gcp_machine_type: e2-micro
      TF_VAR_gcp_disk_size_gb: "30"
      TF_VAR_gcp_disk_type: pd-standard
      TF_VAR_gcp_ssh_username: deploy
      TF_VAR_gcp_network_tags: '["http-server","https-server","lb-health-check"]'
      TF_VAR_gcp_manage_firewall: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Initialize remote state and require the imported VM
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          TF_VAR_gcp_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key
          echo "TF_VAR_gcp_ssh_public_key=$TF_VAR_gcp_ssh_public_key" >> "$GITHUB_ENV"

          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infra/terraform state list | grep -Fxq "$address"; then
            echo "Refusing to plan or apply: import the existing VM first." >&2
            exit 1
          fi

      - name: Create saved plan and reject destructive changes
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform plan -input=false -out=tfplan
          terraform -chdir=infra/terraform show -json tfplan > infra/terraform/plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("infra/terraform/plan.json").read_text())
          deletes = [
              change["address"]
              for change in plan["resource_changes"]
              if "delete" in change["change"]["actions"]
          ]
          if deletes:
              raise SystemExit(
                  "Refusing plan with resource deletion/replacement: "
                  + ", ".join(deletes)
              )
          PY

          terraform -chdir=infra/terraform show -no-color tfplan \
            > "$RUNNER_TEMP/terraform-plan.txt"
          {
            echo '### GCP Terraform plan'
            echo 'The apply job requires approval in the `gcp-terraform-apply` environment.'
            echo '```'
            cat "$RUNNER_TEMP/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infra/terraform/tfplan
          retention-days: 30

  terraform-apply:
    name: Terraform apply (approval required)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'terraform-apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: gcp-terraform-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCP Workload Identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set the repository Actions variable GCP_TERRAFORM_SERVICE_ACCOUNT}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/download-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infra/terraform

      - name: Apply the reviewed plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infra/terraform state list | grep -Fxq "$address"; then
            echo "Refusing to apply: the VM is not imported into Terraform state." >&2
            exit 1
          fi
          terraform -chdir=infra/terraform apply -input=false -auto-approve tfplan

  publish-gcp-images:
    name: Publish GCP container images (paused)
    if: ${{ false }}
    needs: [backend-tests, frontend-tests, dependency-audit, secret-scan, terraform-security, k8s-kind-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/ssaiyajin/careerops-backend:latest
            ghcr.io/ssaiyajin/careerops-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/ssaiyajin/careerops-frontend:latest
            ghcr.io/ssaiyajin/careerops-frontend:${{ github.sha }}

  scan-gcp-images:
    name: Scan published container images (paused)
    if: ${{ false }}
    needs: publish-gcp-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/ssaiyajin/careerops-backend:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/ssaiyajin/careerops-frontend:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy-gcp:
    name: Deploy to GCP VM (paused)
    if: ${{ false }}
    needs: scan-gcp-images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Write SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY repository secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/careerops-deploy"
          chmod 600 "$HOME/.ssh/careerops-deploy"

      - name: Write verified VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST || vars.VM_HOST }}
          VM_KNOWN_HOST: ${{ secrets.VM_KNOWN_HOST || vars.VM_KNOWN_HOST }}
        run: |
          set -euo pipefail
          : "${VM_HOST:?Set the VM_HOST repository or production environment variable}"
          : "${VM_KNOWN_HOST:?Set the VM_KNOWN_HOST secret or variable after verifying it out of band}"
          printf '%s\n' "$VM_KNOWN_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable images over IAP SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST || vars.VM_HOST }}
          VM_SSH_USER: ${{ vars.VM_USER || 'deploy' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_INSTANCE: ${{ vars.GCP_VM_INSTANCE || 'careerops' }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE || 'us-central1-a' }}
        run: |
          set -euo pipefail
          : "${VM_HOST:?Set VM_HOST}"
          : "${VM_SSH_USER:?Set VM_USER or use deploy}"
          : "${GHCR_READ_TOKEN:?Set GHCR_READ_TOKEN with read:packages access}"
          : "${GHCR_USERNAME:?Set GHCR_USERNAME to the GitHub account that owns the token}"
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID Actions variable}"

          ssh_options=(
            -i "$HOME/.ssh/careerops-deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o "ProxyCommand=gcloud compute start-iap-tunnel '$GCP_VM_INSTANCE' 22 --listen-on-stdin --project='$GCP_PROJECT_ID' --zone='$GCP_VM_ZONE'"
          )

          ssh "${ssh_options[@]}" "$VM_SSH_USER@$VM_HOST" "bash -se" <<'BOOTSTRAP'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y docker.io
          fi
          sudo -n systemctl enable --now docker
          sudo -n usermod -aG docker "$(id -un)"
          if ! sudo -n docker compose version >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y docker-compose-plugin || sudo -n apt-get install -y docker-compose-v2
          fi
          sudo -n docker compose version

          if ! sudo -n swapon --noheadings --show=NAME | grep -Fxq /swapfile; then
            if [ ! -f /swapfile ] || [ "$(sudo -n stat -c '%s' /swapfile)" -ne 2147483648 ]; then
              sudo -n rm -f /swapfile
              sudo -n fallocate -l 2G /swapfile || sudo -n dd if=/dev/zero of=/swapfile bs=1M count=2048 status=progress
              sudo -n chmod 600 /swapfile
              sudo -n mkswap /swapfile
            fi
            sudo -n swapon /swapfile
          fi
          if ! sudo -n grep -q '^/swapfile none swap' /etc/fstab; then
            printf '/swapfile none swap sw 0 0\n' | sudo -n tee -a /etc/fstab >/dev/null
          fi
          if [ "$(sudo -n stat -c '%s' /swapfile)" -ne 2147483648 ]; then
            echo "Expected the VM swap file to be exactly 2 GiB." >&2
            exit 1
          fi
          BOOTSTRAP

          printf '%s' "$GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$VM_SSH_USER@$VM_HOST" \
            "sudo -n docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin && sudo -n chmod 600 /root/.docker/config.json"

          ssh "${ssh_options[@]}" "$VM_SSH_USER@$VM_HOST" "COMMIT_SHA=$IMAGE_TAG bash -se" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$HOME/careerops"
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch main --single-branch https://github.com/Ssaiyajin/careerops.git "$APP_DIR"
            git -C "$APP_DIR" fetch --depth 1 origin "$COMMIT_SHA"
          else
            git -C "$APP_DIR" fetch --depth 1 origin "$COMMIT_SHA"
          fi
          git -C "$APP_DIR" checkout --detach "$COMMIT_SHA"
          cd "$APP_DIR"

          sudo -n docker compose version
          sudo -n swapon --noheadings --show=NAME | grep -Fxq /swapfile || {
            echo "The 2 GiB swap file is not active." >&2
            exit 1
          }
          if ! sudo -n grep -q '^/swapfile none swap' /etc/fstab; then
            printf '/swapfile none swap sw 0 0\n' | sudo -n tee -a /etc/fstab >/dev/null
          fi
          if [ "$(sudo -n stat -c '%s' /swapfile)" -ne 2147483648 ]; then
            echo "Expected the VM swap file to be exactly 2 GiB." >&2
            exit 1
          fi

          if [ ! -f .env ] ||
             ! sudo -n grep -Eq '^DATABASE_URL=postgres(ql)?://[^[:space:]]+[?&]sslmode=require$' .env ||
             sudo -n grep -Eq '^DATABASE_URL=postgres(ql)?://USER:PASSWORD@HOST/DB' .env ||
             ! sudo -n grep -Eq '^JWT_SECRET_KEY=.{32,}$' .env ||
             sudo -n grep -Eq '^JWT_SECRET_KEY=(REPLACE|YOUR)' .env ||
             ! sudo -n grep -Eq '^GEMINI_API_KEY=.+$' .env ||
             sudo -n grep -Eq '^GEMINI_API_KEY=(REPLACE|YOUR)' .env; then
            echo "Create $APP_DIR/.env with a Neon DATABASE_URL, a strong JWT_SECRET_KEY (32+ characters), and GEMINI_API_KEY." >&2
            exit 1
          fi
          sudo -n chmod 600 .env

          sudo -n env IMAGE_TAG="$COMMIT_SHA" docker compose --env-file .env -f docker-compose.prod.yml pull
          sudo -n env IMAGE_TAG="$COMMIT_SHA" docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
          sudo -n docker image prune -f
          sudo -n docker compose --env-file .env -f docker-compose.prod.yml exec -T backend \
            python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=10)"
          REMOTE

      - name: Check public frontend
        env:
          VM_HOST: ${{ secrets.VM_HOST || vars.VM_HOST }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 3 "http://$VM_HOST/"
