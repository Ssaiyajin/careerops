name: GCP Terraform

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Import the existing VM once, or plan and request approval to apply
        required: true
        type: choice
        options:
          - import-existing-vm
          - plan-and-apply

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: careerops-gcp-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_enable_aws: "false"
  TF_VAR_enable_azure: "false"
  TF_VAR_enable_gcp: "true"
  TF_VAR_gcp_project: careerops-503307
  TF_VAR_gcp_region: us-central1
  TF_VAR_gcp_zone: us-central1-a
  TF_VAR_gcp_instance_name: careerops
  TF_VAR_gcp_machine_type: e2-micro
  TF_VAR_gcp_disk_size_gb: "30"
  TF_VAR_gcp_disk_type: pd-standard
  TF_VAR_gcp_ssh_username: deploy
  TF_VAR_gcp_network_tags: '["http-server","https-server","lb-health-check"]'
  TF_VAR_gcp_manage_firewall: "false"

jobs:
  import-existing-vm:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'import-existing-vm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Import the existing GCP VM into remote state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set repository variable TF_STATE_BUCKET after bootstrapping the bucket}"
          : "${VM_SSH_KEY:?Set repository secret VM_SSH_KEY}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key="$ssh_public_key"
          echo "TF_VAR_gcp_ssh_public_key=$ssh_public_key" >> "$GITHUB_ENV"

          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "The VM is already present in Terraform state; do not import it twice." >&2
            exit 1
          fi

          terraform -chdir=infrastructure import -input=false \
            "$address" \
            "projects/careerops-503307/zones/us-central1-a/instances/careerops"

  plan:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan-and-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Initialize and verify imported VM
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set repository variable TF_STATE_BUCKET after bootstrapping the bucket}"
          : "${VM_SSH_KEY:?Set repository secret VM_SSH_KEY}"

          key_file="$RUNNER_TEMP/vm_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_gcp_ssh_public_key="$ssh_public_key"
          echo "TF_VAR_gcp_ssh_public_key=$ssh_public_key" >> "$GITHUB_ENV"

          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "Refusing to plan/apply: import the existing VM first using operation=import-existing-vm." >&2
            exit 1
          fi

      - name: Create plan and reject destructive changes
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure plan -input=false -out=tfplan
          terraform -chdir=infrastructure show -json tfplan > infrastructure/plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("infrastructure/plan.json").read_text())
          deletes = [
              change["address"]
              for change in plan["resource_changes"]
              if "delete" in change["change"]["actions"]
          ]
          if deletes:
              raise SystemExit(
                  "Refusing plan containing resource deletion/replacement: "
                  + ", ".join(deletes)
              )
          PY

          terraform -chdir=infrastructure show -no-color tfplan > "$RUNNER_TEMP/terraform-plan.txt"
          {
            echo '### GCP Terraform plan'
            echo 'The apply job waits for approval in the `gcp-terraform-apply` GitHub Environment.'
            echo '```'
            cat "$RUNNER_TEMP/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infrastructure/tfplan
          retention-days: 1

  apply:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan-and-apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: gcp-terraform-apply
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Download the reviewed Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: gcp-terraform-plan
          path: infrastructure

      - name: Apply approved plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set repository variable TF_STATE_BUCKET}"
          terraform -chdir=infrastructure init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=careerops/gcp"

          address='module.gcp.google_compute_instance.this[0]'
          if ! terraform -chdir=infrastructure state list | grep -Fxq "$address"; then
            echo "Refusing to apply: the existing VM is not imported into Terraform state." >&2
            exit 1
          fi
          terraform -chdir=infrastructure apply -input=false -auto-approve tfplan

      - name: Trigger the SSH application deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pipeline.yml --ref main
