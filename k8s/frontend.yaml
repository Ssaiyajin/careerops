apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerops-frontend
  namespace: careerops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careerops-frontend
  template:
    metadata:
      labels:
        app: careerops-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ssaiyajin/careerops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: BACKEND_API_URL
              value: http://careerops-backend:8000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: careerops-frontend
  namespace: careerops
spec:
  type: ClusterIP
  selector:
    app: careerops-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
