apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerops-backend
  namespace: careerops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careerops-backend
  template:
    metadata:
      labels:
        app: careerops-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ssaiyajin/careerops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: careerops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: careerops-backend
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: careerops-backend
                  key: JWT_SECRET_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: careerops-backend
                  key: GEMINI_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: careerops-backend
  namespace: careerops
spec:
  type: ClusterIP
  selector:
    app: careerops-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
