global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: careerops-production
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:18000

  - job_name: careerops-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
